name: tests

# Roda a cada push e pull request. É a rede de segurança do projeto:
# nenhum código entra na main sem os testes passarem (ADR-0001).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install dependencies and build assets
        run: composer setup

      - name: Seed demo data (checks the seeder runs)
        run: php artisan migrate:fresh --seed --force

      - name: Tests
        run: php artisan test

      # "success() || failure()" roda estas etapas mesmo se os testes falharem,
      # para ver todos os problemas numa execução só.
      - name: Code style (Pint)
        if: success() || failure()
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        if: success() || failure()
        run: vendor/bin/phpstan analyse --memory-limit=1G

  # Garante que a configuração Docker (ADR-0012) continua funcionando:
  # constrói a imagem, roda os testes dentro dela e sobe a loja de verdade.
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t loja-pneus .

      - name: Tests inside the image
        run: docker run --rm loja-pneus sh -c "cp .env.example .env && php artisan key:generate && php artisan test"

      - name: Start with docker compose
        run: docker compose up -d --build

      - name: Smoke test (home, store page and login)
        run: |
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8000/ && break; sleep 2; done
          curl -fsS http://localhost:8000/ | grep -q "Encontre pneus"
          curl -fsS http://localhost:8000/lojas/pneus-curitiba | grep -q "Pneus Curitiba"
          curl -fsS -o /dev/null http://localhost:8000/login

      - name: Logs on failure
        if: failure()
        run: docker compose logs
